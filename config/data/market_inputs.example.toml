# Plantilla de datos de mercado.
# Copia este fichero a config/data/market_inputs.toml y rellena cada campo con
# el dato real, su fuente y su fecha. Tasas en decimal: 0.03 = 3 %.
# Mientras falten claves, la valoración falla con un error claro (no hay valores por defecto).

[risk_free_rate]
# Rentabilidad libre de riesgo, p. ej. bono alemán (Bund) a 10 años.
# Se puede sacar para europa por ejemplo de https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_area_yield_curves/html/index.en.html
# value =
# source = ""
# date = AAAA-MM-DD

[market_risk_premium]
# Prima de un mercado MADURO (p. ej. la «Equity Risk Premium» de un país Aaa de Damodaran).
# La prima de cada país va aparte, en [country_risk_premium].
#https://pages.stern.nyu.edu/adamodar/New_Home_Page/datafile/ctryprem.html
# value =
# source = ""
# date = AAAA-MM-DD

# OPCIONAL. Coste de la deuda antes de impuestos para estimar los intereses de los
# ejercicios en que Yahoo no los publica: intereses = value × deuda total del año.
# Si se omite la sección y faltan intereses, la carga falla con un error claro.
# Descomenta la sección completa para usarla.
# [default_cost_of_debt]
# value =
# source = ""
# date = AAAA-MM-DD

# OBLIGATORIO por país. Prima de riesgo país (la «Country Risk Premium» de Damodaran):
# Ke = máx(rf + β · PRM + prima país, rf + PRM + prima país).
# La clave es el país de la sede según Yahoo (info["country"], en inglés: "Spain",
# "United States", "Germany"...). value = 0 si el país no tiene prima.
# https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/ctryprem.html
# [country_risk_premium."Spain"]
# value =
# source = ""
# date = AAAA-MM-DD

# OPCIONAL. Betas sectoriales DESAPALANCADAS para el modo de beta "bottom-up" (por defecto).
# Clave: industryKey de Yahoo (p. ej. "engineering-construction") o, si no está, sectorKey
# (p. ej. "industrials"); se ven en el informe y en data/cache/<TICKER>/<fecha>/meta.json.
# Se reapalancan con el D/E de cada empresa. Sin beta sectorial se usa la de Yahoo ajustada
# por Blume (0,67 · beta + 0,33).
# https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html (Unlevered beta)
# [sector_beta."engineering-construction"]
# value =
# source = ""
# date = AAAA-MM-DD

# OPCIONAL. Beta de la acción. Sin esta sección se usa el modo "bottom-up".
# mode:
#   "bottom-up"      beta sectorial reapalancada; sin ella, Yahoo ajustada por Blume; si
#                    Yahoo no la publica o es negativa, la beta de esta sección.
#   "yahoo"          solo la de Yahoo sin ajustar; error si no la publica o es negativa.
#   "fichero"        siempre la del fichero (override de la de Yahoo).
#   "yahoo-fichero"  la de Yahoo; si no la publica o es negativa, la del fichero
#                    (el informe indica el motivo).
# value/source/date en [beta] valen para todos los tickers; en [beta."TICKER"] solo
# para ese ticker y prevalecen sobre la general (el ticker también puede fijar su mode).
# Betas sectoriales: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html
# [beta]
# mode = "yahoo-fichero"
#
# [beta."REP.MC"]
# value =
# source = ""
# date = AAAA-MM-DD

# OPCIONAL. Tasa de descuento forzada por ticker: sustituye al WACC (modelo fcff_cfo) o a Ke
# (modelo fcfe) calculados, que pasan a ser informativos. Precedencia:
# --set rate=... (todos los tickers) > esta sección > calculada.
# Solo por ticker: no hay valor general en el fichero.
# [discount_rate."REP.MC"]
# value =
# source = ""
# date = AAAA-MM-DD

# Opcional, por ticker: múltiplo de salida del valor terminal (vt_mult): EV/EBITDA en los
# modelos FCFF y P/E en los FCFE. --set exit_multiple= prevalece. Sin múltiplo, vt_mult da error.
# [exit_multiple."IDR.MC"]
# value = 9.0
# source = "Mediana EV/EBITDA de comparables (introducido por el usuario)"
# date = 2026-11-21

# Opcional, por ticker: RONIC del Gordon con value driver (ROE en los FCFE), en decimal.
# --set ronic= prevalece. Sin él se usa el ROIC (o ROE) histórico medio.
# [ronic."IDR.MC"]
# value = 0.10
# source = "RONIC ≈ WACC a largo plazo (supuesto prudente)"
# date = 2026-11-21
